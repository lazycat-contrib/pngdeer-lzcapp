name: probe
on:
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: list toolchain
        run: |
          echo "=== clang/llvm-ar in /usr/bin ==="
          ls -la /usr/bin/llvm-ar* /usr/bin/clang* 2>&1 | head -25
          echo "=== wasm32 target support ==="
          for c in /usr/bin/clang /usr/bin/clang-18 /usr/bin/clang-17 /usr/bin/clang-16; do
            if [ -x "$c" ]; then echo "$c -> $($c -print-targets 2>/dev/null | grep -c wasm32) wasm targets"; fi
          done
          echo "=== rustup ==="
          rustup --version 2>&1 | head -1
          echo "=== whoami ==="
          whoami
          echo "=== apt writable? ==="
          touch /var/lib/apt/lists/.probe 2>&1 | head -1
